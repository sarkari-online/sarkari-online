server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 25M;

    # High-Performance Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;
    gzip_comp_level 6;

    # Clean URL Rewrites for Sarkari.online
    rewrite ^/sitemap\.xml$ /sitemap.php last;
    rewrite ^/article/([a-zA-Z0-9_-]+)/?$ /article.php?slug=$1 last;
    rewrite ^/category/([a-zA-Z0-9_-]+)/?$ /category.php?slug=$1 last;
    rewrite ^/search/?$ /search.php last;
    rewrite ^/about/?$ /about.php last;
    rewrite ^/why-choose-us/?$ /why-choose-us.php last;
    rewrite ^/contact/?$ /contact.php last;
    rewrite ^/privacy-policy/?$ /privacy-policy.php last;
    rewrite ^/disclaimer/?$ /disclaimer.php last;
    rewrite ^/terms/?$ /terms.php last;
    rewrite ^/editorial-policy/?$ /editorial-policy.php last;
    rewrite ^/ai-policy/?$ /ai-policy.php last;

    # Clean URL Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # FastCGI PHP Handler
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Security: Deny hidden files and database folder
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ^~ /storage/logs/ {
        deny all;
        return 403;
    }

    location ^~ /database/ {
        deny all;
        return 403;
    }

    # Static Assets Caching
    location ~* \.(jpg|jpeg|png|gif|webp|svg|css|js|ico|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}
