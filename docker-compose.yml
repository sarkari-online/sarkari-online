services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sarkari_app
    restart: unless-stopped
    ports:
      # Bind exclusively to 127.0.0.1:8085 (Completely isolated from host client sites)
      - "127.0.0.1:8085:80"
    environment:
      APP_NAME: ${APP_NAME:-Sarkari.online}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://sarkari.online}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-sarkari_online_db}
      DB_USERNAME: ${DB_USERNAME:-sarkari_user}
      DB_PASSWORD: ${DB_PASSWORD:-sarkari_secure_password_8923}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      AUTO_PUBLISH_DAILY_LIMIT: ${AUTO_PUBLISH_DAILY_LIMIT:-5}
      MIN_QUALITY_SCORE: ${MIN_QUALITY_SCORE:-85}
    volumes:
      - sarkari_uploads:/var/www/html/uploads
      - sarkari_storage:/var/www/html/storage
    depends_on:
      - db
    networks:
      - sarkari_network

  db:
    image: mariadb:10.11
    container_name: sarkari_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-sarkari_root_password_9283}
      MYSQL_DATABASE: ${DB_DATABASE:-sarkari_online_db}
      MYSQL_USER: ${DB_USERNAME:-sarkari_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sarkari_secure_password_8923}
    volumes:
      - sarkari_db_data:/var/lib/mysql
    networks:
      - sarkari_network

volumes:
  sarkari_db_data:
    name: sarkari_db_data
  sarkari_uploads:
    name: sarkari_uploads
  sarkari_storage:
    name: sarkari_storage

networks:
  sarkari_network:
    name: sarkari_network
    driver: bridge
